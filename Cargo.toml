[package]
name = "imap-backup-cli"
version = "1.1.0"
edition = "2021"
authors = ["Sistemas <admin@local>"]
description = "Herramienta nativa en Rust con GUI (egui) para respaldo y migración de buzones IMAP a EML y ZIP"

[dependencies]
# GUI Framework (Immediate Mode & Native Windowing)
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.27"
egui_extras = { version = "0.27", features = ["default"] }
rfd = "0.14" # Native file and folder dialogs

# Async Runtime & Concurrency
tokio = { version = "1.38", features = ["full"] }
futures = "0.3"

# IMAP & TLS
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["native-tls"] }
native-tls = "0.2"

# Serialization & Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Compression & File System
zip = { version = "2.1", default-features = false, features = ["deflate", "time"] }
walkdir = "2.5"
sanitize-filename = "0.5"

# Date, Time & Utilities
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
colored = "2.1"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
