name: Release v2 (Windows & Linux)

# Publica la reescritura v2 (v2/) cuando se pushea un tag v2*.
# Adjunta a la release los dos binarios de cada plataforma (GUI y headless),
# más un archivo SHA256SUMS para verificar las descargas.

on:
  push:
    tags: [ 'v2*' ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nombre del tag (ej: v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            v2/target/
          key: windows-v2-cargo-${{ hashFiles('v2/Cargo.lock') }}

      # El binario GUI se renombra imap-backup-gui.exe para conservar el nombre
      # histórico; el headless conserva el del paquete (imap-backup.exe).
      - name: Build GUI and headless binaries
        working-directory: v2
        run: |
          cargo build --release --target x86_64-pc-windows-msvc --bin imap-backup-gui
          cargo build --release --target x86_64-pc-windows-msvc --bin imap-backup

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "pkg" -Force
          Copy-Item "v2/target/x86_64-pc-windows-msvc/release/imap-backup-gui.exe" -Destination "pkg/"
          Copy-Item "v2/target/x86_64-pc-windows-msvc/release/imap-backup.exe" -Destination "pkg/"
          Copy-Item "v2/README.md" -Destination "pkg/"
          Compress-Archive -Path "pkg/*" -DestinationPath "imap-backup-v2-windows-x64.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-v2
          path: imap-backup-v2-windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev \
                                  libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            v2/target/
          key: linux-v2-cargo-${{ hashFiles('v2/Cargo.lock') }}

      - name: Build GUI and headless binaries
        working-directory: v2
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu --bin imap-backup-gui
          cargo build --release --target x86_64-unknown-linux-gnu --bin imap-backup

      - name: Package Linux tar.gz
        run: |
          mkdir -p pkg
          cp v2/target/x86_64-unknown-linux-gnu/release/imap-backup-gui pkg/
          cp v2/target/x86_64-unknown-linux-gnu/release/imap-backup pkg/
          chmod +x pkg/imap-backup-gui pkg/imap-backup
          cp v2/README.md pkg/
          tar -czf imap-backup-v2-linux-x64.tar.gz -C pkg .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-v2
          path: imap-backup-v2-linux-x64.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Determine release tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG_NAME=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      # Los hashes permiten verificar la descarga: así el aviso de Chrome
      # ("archivo peligroso") se contrasta con el SHA-256 publicado.
      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum imap-backup-v2-*.zip imap-backup-v2-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag_info.outputs.TAG_NAME }}
          name: "imap-backup v2 ${{ steps.tag_info.outputs.TAG_NAME }}"
          generate_release_notes: true
          body: |
            ## imap-backup 2.0 — reescritura con sincronización incremental real

            Esta release compila el código de `v2/`: motor nuevo con manifiesto por
            cuenta (UIDVALIDITY, flags, fechas, hashes), descarga solo de lo que falta,
            restauración idempotente, migración directa servidor→servidor, verificación
            local sin conexión y modo headless para automatizar.

            ### Contenido del paquete
            - `imap-backup-gui` — interfaz gráfica (egui).
            - `imap-backup` — modo consola (backup/restore/migrate/verify/test-connection).

            ### Verificar la descarga
            Si Chrome marca el archivo como "peligroso" (ocurre con ejecutables nuevos
            sin firma digital), contrastá el SHA-256 del archivo con el publicado en
            `SHA256SUMS.txt`. Si coinciden, el archivo llegó intacto y el aviso es el
            falso positivo habitual de binarios sin reputación.

            ### Inicio rápido
            ```bash
            ./imap-backup help          # ayuda del modo consola
            ./imap-backup-gui           # interfaz gráfica
            ```
          files: |
            dist/imap-backup-v2-windows-x64.zip
            dist/imap-backup-v2-linux-x64.tar.gz
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
