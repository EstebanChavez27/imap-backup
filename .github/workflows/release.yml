name: Build and Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nombre de la versión (ej: v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Binary
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release_pkg_win" -Force
          Copy-Item "target/x86_64-pc-windows-msvc/release/imap-backup-cli.exe" -Destination "release_pkg_win/imap-backup-gui.exe"
          Copy-Item "config.example.toml" -Destination "release_pkg_win/"
          Copy-Item "config.example.json" -Destination "release_pkg_win/"
          Copy-Item "README.md" -Destination "release_pkg_win/"
          Compress-Archive -Path "release_pkg_win/*" -DestinationPath "imap-backup-windows-x64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-zip
          path: imap-backup-windows-x64.zip

  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev \
                                  libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package Linux tar.gz
        run: |
          mkdir -p release_pkg_linux
          cp target/x86_64-unknown-linux-gnu/release/imap-backup-cli release_pkg_linux/imap-backup-gui
          chmod +x release_pkg_linux/imap-backup-gui
          cp config.example.toml config.example.json README.md release_pkg_linux/
          tar -czvf imap-backup-linux-x64.tar.gz -C release_pkg_linux .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-tar
          path: imap-backup-linux-x64.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: windows-release-zip
          path: ./dist

      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: linux-release-tar
          path: ./dist

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.TAG_NAME }}
          name: "IMAP Backup & Migration Suite ${{ steps.tag_info.outputs.TAG_NAME }}"
          body: |
            ## 📦 IMAP Backup & Migration Suite (Rust Native GUI)

            Aplicación de escritorio ultra ligera en Rust con interfaz gráfica (GUI) nativa para respaldo y migración de buzones de correo IMAP a formato `.eml` y `.zip`.

            ### 📥 Descargas de Instaladores / Binarios Portables:
            - **Windows (64-bit):** `imap-backup-windows-x64.zip` (incluye `imap-backup-gui.exe` y plantillas de configuración).
            - **Linux (64-bit):** `imap-backup-linux-x64.tar.gz` (binario ejecutable con interfaz GTK3/OpenGL).

            ### 🚀 Instrucciones de Inicio Rápido:
            1. Descomprime el archivo descargado.
            2. Ejecuta la aplicación (`imap-backup-gui.exe` en Windows o `./imap-backup-gui` en Linux).
            3. Añade tus cuentas o carga tu archivo `config.toml` / `config.json` y presiona **"Iniciar Backup"**.
          files: |
            ./dist/imap-backup-windows-x64.zip
            ./dist/imap-backup-linux-x64.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
